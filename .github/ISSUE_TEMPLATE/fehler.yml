name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was hast du erwartet, was kam heraus?
    validations:
      required: true
  - type: dropdown
    id: methode
    attributes:
      label: Methode
      options:
        - Skalieren
        - Spiegeln
        - Füllen – inhaltsbasiert
        - Füllen – generativ
    validations:
      required: true
  - type: textarea
    id: meldung
    attributes:
      label: Zusammenfassung / Fehlermeldung des Scripts
      description: Text aus dem Meldungsfenster am Ende, gern als Screenshot.
  - type: input
    id: indesign
    attributes:
      label: InDesign-Version und Sprache
      placeholder: z. B. InDesign 2026 (21.5), Deutsch
    validations:
      required: true
  - type: input
    id: photoshop
    attributes:
      label: Photoshop-Version (nur bei „Füllen“)
      placeholder: z. B. Photoshop 2026 (27.10)
  - type: input
    id: system
    attributes:
      label: Betriebssystem
      placeholder: z. B. macOS 26 / Windows 11
    validations:
      required: true
  - type: textarea
    id: datei
    attributes:
      label: Bild / Rahmen
      description: Dateityp (JPG, PSD, PDF, AI …), Farbmodus, gedreht/gespiegelt, Einzel- oder Doppelseite. Beispieldateien helfen sehr.
